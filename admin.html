<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Appointments</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="logo-icon.png" alt="Dr. Hammad Shah Dental Clinic logo">
      <span class="brand-text">
        <strong>Admin Dashboard</strong>
        <small>Appointments</small>
      </span>
    </a>
    <div class="header-actions">
      <button class="btn btn-ghost" id="logoutBtn" hidden>Log out</button>
    </div>
  </div>
</header>

<!-- ================= LOGIN ================= -->
<section class="section" id="loginSection">
  <div class="section-inner admin-login-box">
    <p class="eyebrow">Restricted Area</p>
    <h2>Admin login</h2>
    <form id="loginForm" class="booking-form" novalidate>
      <div class="form-field">
        <label for="adminEmail">Email</label>
        <input type="email" id="adminEmail" required autocomplete="username">
      </div>
      <div class="form-field">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-lg">Log In</button>
      <p class="form-status" id="loginStatus" role="status"></p>
    </form>
  </div>
</section>

<!-- ================= DASHBOARD ================= -->
<section class="section" id="dashboardSection" hidden>
  <div class="section-inner">
    <p class="eyebrow">Appointments</p>
    <h2>All bookings</h2>
    <p class="section-lead" id="dashboardStatus">Loading…</p>

    <div class="admin-table-wrap">
      <table class="admin-table" id="apptTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Name</th>
            <th>CNIC</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Reason</th>
            <th>Notes</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="apptTableBody"></tbody>
      </table>
    </div>
  </div>
</section>

<script type="module" src="admin.js"></script>
</body>
</html>
